[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "browser-exploration-agent"
version = "0.1.0"
description = "Bounded autonomous browser exploration through Playwright MCP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "anyio>=4.14.2,<5",
    "langchain-core>=1.6.1,<2",
    "langchain-mcp-adapters>=0.2.2,<0.3",
    "langchain-openai>=1.6.0,<2",
    "langgraph>=1.2.11,<2",
    "langsmith>=0.11.2,<1",
    "mcp>=1.26,<2",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-dotenv>=1.2.3,<2",
    "typer>=0.16,<1",
]

[project.scripts]
qa-browser = "browser_exploration.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2.12,<3",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7.1,<8",
    "pytest-reportportal==5.6.10",
    "pytest-xdist==3.8.0",
    "ruff>=0.16.4,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/browser_exploration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live_mcp: opt-in test requiring a real Playwright MCP server",
    "live_llm: opt-in real-model component test with a synthetic browser",
]
addopts = ["-ra", "--strict-markers", "--strict-config"]
rp_endpoint = "http://localhost:8080"
rp_project = "system_a"
# Set RP_API_KEY in .env.reportportal or the environment.
rp_launch = "Browser exploration unit tests"
rp_launch_attributes = ["suite:unit", "browser:fake", "model:fake"]
rp_launch_description = "Offline unit suite with injected browser and model transports."
rp_log_level = "INFO"

# pytest-reportportal 5.6.10 does not define an rp_xdist_enabled option.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "evals", "scripts", "examples/browser_exploration/mock_run.py"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
